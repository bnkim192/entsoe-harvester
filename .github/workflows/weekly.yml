# 폴란드 전력단가 및 원자재 가격동향 — 주간 PPT + Excel raw
# .github/workflows/weekly.yml 경로에 두어야 인식됨. (매일 도는 collect.yml, outages.yml 은 건드리지 않는다)
name: PL Weekly Report
on:
  schedule:
    - cron: "0 2 * * 1"        # 매주 월 02:00 UTC = 한국 11:00 (일요일 실측까지 다 들어온 뒤)
  workflow_dispatch:
    inputs:
      week_end:
        description: "보고 주의 마지막 일요일 YYYY-MM-DD (비우면 직전 일요일)"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: entsoe-commit
  cancel-in-progress: false
jobs:
  weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd python-pptx tzdata
      - name: PL drivers (가격·주변국·수요·발전·기상)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_drivers.py
      - name: Market (탄소배출권·브렌트·가스/석탄 월평균·환율 + TGE 프로브)
        continue-on-error: true
        run: python fetch_pl_market.py
      - name: 국경 간 흐름 (ENTSO-E A11, 일요일까지 채우기)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_flows.py
      - name: 발전설비 정지 (ENTSO-E A80, 보고 직전 최신)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_outages.py
      - name: Weekly PPT + Excel
        continue-on-error: true
        env:
          PLW_WEEK_END: ${{ github.event.inputs.week_end }}
        run: python pl_weekly_report.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pl-weekly-report
          path: |
            weekly/latest/
            pl_drivers_diag.json
            pl_flows_diag.json
            tge_probe.json
      - name: commit back
        run: |
          git config user.name "entsoe-bot"
          git config user.email "entsoe-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: pl weekly report $(date +%F)" || echo "no change"
          git pull --rebase || true
          git push || echo "push skip"
