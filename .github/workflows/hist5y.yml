# 폴란드 5년 일별 자료 한 번 받기 (2022~2025) → pl_hist_5y.json
# .github/workflows/hist5y.yml 경로에 두어야 인식됨. 수동 실행 전용(Actions 탭 → Run workflow)
name: PL History 5y
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: entsoe-commit
  cancel-in-progress: false
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd tzdata
      - name: 5년 일별 수집
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_hist5y.py
      - name: commit back
        run: |
          git config user.name "entsoe-bot"
          git config user.email "entsoe-bot@users.noreply.github.com"
          git add pl_hist_5y.json
          git commit -m "chore: pl history 5y $(date +%F)" || { echo "no change"; exit 0; }
          for i in 1 2 3 4 5; do
            if git pull --rebase -X theirs && git push; then echo "push 완료"; exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::저장소 저장 실패(5회)"
          exit 1