# 폴란드 발전설비 출력 감소 공시(TGE GPI) + 국경 간 전력 흐름(ENTSO-E A11, PSE 프로브) 매일 수집
# .github/workflows/outages.yml 경로에 두어야 인식됨. (collect.yml, weekly.yml 은 건드리지 않는다)
name: PL Outages & Flows
on:
  schedule:
    - cron: "30 5 * * *"        # 매일 05:30 UTC = 한국 14:30
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: entsoe-commit
  cancel-in-progress: false
jobs:
  outages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - name: TGE GPI 출력 감소 목록
        continue-on-error: true
        run: python fetch_pl_outages.py
      - name: 국경 간 흐름 (ENTSO-E A11 + PSE 프로브)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_flows.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pl-outages-flows
          path: |
            pl_outages_latest.json
            gpi_probe.json
            gpi_raw/
            pl_flows_daily.csv
            pl_flows_monthly.json
            pl_flows_diag.json
            pse_probe.json
      - name: commit back
        run: |
          git config user.name "entsoe-bot"
          git config user.email "entsoe-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: pl outages & flows $(date +%F)" || echo "no change"
          git pull --rebase || true
          git push || echo "push skip"
