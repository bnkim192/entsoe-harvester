# 매일: 발전설비 정지(ENTSO-E A80) + 국경 간 흐름(A11) + 가격·수급·원자재·가스 저장률 → 일일 Excel(weekly/daily/)
# .github/workflows/outages.yml 경로에 두어야 인식됨. PPT 는 weekly.yml(매주 월요일)만 만든다.
name: PL Outages & Flows
on:
  schedule:
    - cron: "30 5 * * *"        # 매일 05:30 UTC = 한국 14:30
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: entsoe-commit
  cancel-in-progress: false
jobs:
  outages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl xlrd python-pptx tzdata pypdf
      - name: PSE 계획정지 엔드포인트 찾기 (1회용 프로브, 실패해도 계속)
        continue-on-error: true
        run: python fetch_pse_outage_probe.py
      - name: 발전설비 정지 (ENTSO-E A80·A77)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_outages.py
      - name: 국경 간 흐름 (ENTSO-E A11 + PSE 프로브)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_flows.py
      - name: PL drivers (가격·주변국·수요·발전·기상)
        continue-on-error: true
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_drivers.py
      - name: Market (탄소배출권·브렌트·가스/석탄 월평균·환율)
        continue-on-error: true
        run: python fetch_pl_market.py
      - name: 가스 저장률 (GIE AGSI+)
        continue-on-error: true
        env:
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
        run: python fetch_pl_gas_storage.py
      - name: TTF·탄소배출권 선물 곡선 (ICE 공개 지연시세)
        continue-on-error: true
        run: python fetch_fwd_curves.py
      - name: 일일 Excel (PPT 없음)
        continue-on-error: true
        env:
          PLW_MODE: daily
        run: python pl_weekly_report.py
      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pl-daily
          path: |
            weekly/daily/
            pl_outages_latest.json
            pl_outages_diag.json
            pl_flows_diag.json
            pse_probe.json
            fwd_curves.json
            fwd_curves_probe.json
      - name: commit back
        run: |
          git config user.name "entsoe-bot"
          git config user.email "entsoe-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: pl daily $(date +%F)" || echo "no change"
          git pull --rebase || true
          git push || echo "push skip"
