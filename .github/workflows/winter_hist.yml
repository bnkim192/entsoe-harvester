# 한 번만 돌리는 과거 겨울(2023~2025년 10~1월) 바람·수요·가격 수집 → pl_winter_hist.json
# .github/workflows/winter_hist.yml 경로에 두어야 인식됨. 자동 일정 없음(수동 Run 만).
name: PL Winter History (one-off)
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: entsoe-commit
  cancel-in-progress: false
jobs:
  hist:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests tzdata
      - name: 과거 겨울 바람·수요·가격 (ENTSO-E A44·A65·A75 + Open-Meteo ERA5 + ECB)
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python fetch_pl_winter_hist.py
      - name: commit back
        run: |
          git config user.name "entsoe-bot"
          git config user.email "entsoe-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore: pl winter history $(date +%F)" || echo "no change"
          git pull --rebase || true
          git push || echo "push skip"
